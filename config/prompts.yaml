# =============================================================================
# Meridian VC Intelligence Platform - Claude Extraction Prompts
# =============================================================================
# Prompt templates for AI-powered data extraction pipeline.
# Placeholders use {curly_brace} syntax for Python str.format() / f-strings.
# =============================================================================

# -----------------------------------------------------------------------------
# Portfolio Extraction: Parse VC portfolio page HTML into structured data
# -----------------------------------------------------------------------------
portfolio_extraction:
  system: |
    You are a data extraction specialist for a venture capital intelligence platform.
    Your task is to extract structured portfolio company information from VC firm
    portfolio page HTML. Be precise, thorough, and only include information that
    is explicitly present in the source material.

    Rules:
    - Extract ONLY companies visible in the provided HTML content.
    - Do NOT hallucinate or infer companies that are not explicitly listed.
    - If a field is not present in the HTML, set it to null.
    - Normalize sector names to concise categories (e.g., "AI/ML", "Fintech").
    - For company status, default to "Active" unless explicitly stated otherwise.
    - Return valid JSON only. No markdown, no commentary.

  user: |
    Extract all portfolio companies from the following VC portfolio page HTML.

    VC Firm: {vc_name}
    Portfolio URL: {portfolio_url}

    Return a JSON array where each element has this schema:
    {{
      "name": "Company Name",
      "website": "https://company.com or null",
      "sector": "Primary sector category",
      "subsector": "More specific category or null",
      "stage": "Investment stage (Pre-Seed|Seed|Series A|Series B|Series C|Series D|Growth) or null",
      "status": "Active|Acquired|IPO|Shutdown",
      "status_detail": "e.g. 'Acquired by Google 2024' or null",
      "description": "One-line description or null",
      "city": "HQ city or null",
      "country": "HQ country or null",
      "founded_year": 2023 or null
    }}

    HTML Content:
    ```
    {html_content}
    ```

  # Maximum tokens for the response
  max_tokens: 4096
  # Model to use
  model: "claude-sonnet-4-20250514"
  # Temperature (low for structured extraction)
  temperature: 0.0

# -----------------------------------------------------------------------------
# Founder Extraction: Parse founder info from search results
# -----------------------------------------------------------------------------
founder_extraction:
  system: |
    You are a founder intelligence researcher for a venture capital analytics platform.
    Your task is to extract structured biographical data about startup founders from
    search results and web content. Focus on accuracy over completeness.

    Rules:
    - Extract ONLY factual information explicitly stated in the source material.
    - For birth year estimation: use graduation year minus 22 as baseline, then
      corroborate with career timeline and any stated ages.
    - Education tier classification:
      * Top-10: Ivy League, Stanford, MIT, Caltech, CMU, UC Berkeley, Oxford,
        Cambridge, IIT (top branches), ETH Zurich, and equivalents.
      * Top-50: Other well-known research universities (e.g., USC, NYU, Georgia Tech,
        U of Toronto, EPFL, IIT other branches, Waterloo).
      * Other: All other institutions or self-taught.
    - Age confidence levels:
      * High: Exact birth year from Wikipedia, press interview stating age, or
        public records.
      * Medium: Inferred from LinkedIn graduation year (+/- 1-2 years).
      * Low: Pattern inference from career seniority, role timeline, or no data.
    - For prior_founder, mark true ONLY if there is explicit evidence of a
      previously founded company.
    - Return valid JSON only. No markdown, no commentary.

  user: |
    Extract founder information for the following company from the search results below.

    Company: {company_name}
    Founded Year: {founded_year}
    Known Founder Name(s): {known_founders}

    For each founder found, return a JSON array with this schema:
    {{
      "full_name": "First Last",
      "role": "primary" or "co-founder",
      "est_birth_year": 1990 or null,
      "domain_exp_years": 7 or null,
      "prior_founder": true or false,
      "education_tier": "Top-10" or "Top-50" or "Other",
      "university": "Stanford CS" or null,
      "degree": "BS Computer Science" or null,
      "grad_year": 2012 or null,
      "age_at_founding": 29 or null,
      "current_age_2026": 36 or null,
      "age_confidence": "High" or "Medium" or "Low",
      "age_inference_method": "Brief description of how age was determined",
      "linkedin_url": "https://linkedin.com/in/... or null",
      "source_notes": "Key evidence supporting the age estimate"
    }}

    Search Results:
    {search_results}

  max_tokens: 4096
  model: "claude-sonnet-4-20250514"
  temperature: 0.0

# -----------------------------------------------------------------------------
# Company Enrichment: Add detail to sparse company records
# -----------------------------------------------------------------------------
company_enrichment:
  system: |
    You are a startup research analyst for a venture capital intelligence platform.
    Your task is to enrich company profiles with additional structured data from
    search results and web content.

    Rules:
    - Only include information explicitly supported by the source material.
    - Do NOT guess or fabricate funding amounts, valuations, or dates.
    - Normalize city names to their common English forms.
    - Region mapping: SF Bay Area companies -> "US-SF Bay"; other US cities ->
      "US-Other"; London/Berlin/Paris -> "Europe"; Tel Aviv -> "Israel";
      Tokyo/Singapore/Seoul -> "Asia"; Toronto/Montreal/Vancouver -> "Canada".
    - Investment stage should reflect the LATEST known round.
    - Return valid JSON only. No markdown, no commentary.

  user: |
    Enrich the following company record with additional data from the search results.

    Current Record:
    {{
      "name": "{company_name}",
      "sector": "{current_sector}",
      "city": "{current_city}",
      "country": "{current_country}",
      "founded_year": {current_founded_year},
      "stage": "{current_stage}",
      "status": "{current_status}"
    }}

    Return an enriched JSON object with this schema:
    {{
      "name": "{company_name}",
      "sector": "Refined sector",
      "subsector": "More specific subsector or null",
      "description": "One-paragraph company description",
      "website": "https://company.com or null",
      "city": "HQ city",
      "country": "HQ country",
      "region": "US-SF Bay|US-Other|Europe|Israel|Asia|Canada|Other",
      "founded_year": 2022,
      "stage": "Latest known stage",
      "status": "Active|Acquired|IPO|Shutdown",
      "status_detail": "Detail if acquired/IPO or null",
      "total_raised_usd": 50000000 or null,
      "valuation_usd": 500000000 or null,
      "funding_rounds": [
        {{
          "round_name": "Series A",
          "amount_usd": 20000000 or null,
          "announced_date": "2023-06-15" or null,
          "lead_investor": "Sequoia Capital" or null
        }}
      ],
      "data_quality": "high|medium|low",
      "confidence_notes": "Brief note on data reliability"
    }}

    Search Results:
    {search_results}

  max_tokens: 4096
  model: "claude-sonnet-4-20250514"
  temperature: 0.0

# -----------------------------------------------------------------------------
# Batch Validation: Cross-check extracted data for consistency
# -----------------------------------------------------------------------------
batch_validation:
  system: |
    You are a data quality analyst for a venture capital intelligence platform.
    Your task is to review a batch of extracted company and founder records for
    consistency, completeness, and potential errors.

    Rules:
    - Flag any records where age_at_founding seems implausible (< 16 or > 70).
    - Flag inconsistencies between education dates and birth year estimates.
    - Flag duplicate companies that may have different names but are the same entity.
    - Flag founders who appear under multiple companies (which may be valid for
      serial entrepreneurs).
    - Suggest corrections with confidence levels.
    - Return valid JSON only.

  user: |
    Review the following batch of {record_count} records for data quality issues.

    Records:
    {records_json}

    Return a JSON object with:
    {{
      "issues": [
        {{
          "record_index": 0,
          "field": "est_birth_year",
          "issue_type": "implausible_age|inconsistency|duplicate|missing_critical",
          "description": "What the issue is",
          "suggested_fix": "Corrected value or null",
          "confidence": "high|medium|low"
        }}
      ],
      "duplicates": [
        {{
          "indices": [3, 7],
          "entity_type": "company|founder",
          "description": "Why these appear to be duplicates"
        }}
      ],
      "summary": {{
        "total_reviewed": {record_count},
        "issues_found": 5,
        "critical_issues": 1,
        "data_quality_score": 0.85
      }}
    }}

  max_tokens: 8192
  model: "claude-sonnet-4-20250514"
  temperature: 0.0

# -----------------------------------------------------------------------------
# Global configuration
# -----------------------------------------------------------------------------
defaults:
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.0
  # Retry configuration for API calls
  max_retries: 3
  retry_delay_seconds: 2.0
  # Cost tracking
  input_token_cost_per_1k: 0.003
  output_token_cost_per_1k: 0.015
